[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-swarm-setup"
version = "1.0.0"
description = "Clean V5B, V8, and V10 KLAX weather-market research runner"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
legacy-import = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=15"]
online = ["requests>=2.32"]
dev = ["pytest>=8.0"]

[project.scripts]
kalshi-swarm = "kalshi_swarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

